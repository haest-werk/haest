[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/haest-werk/haest"
readme = "README.md"
keywords = ["agent", "llm", "ai", "tools", "mcp"]
categories = ["development-tools"]

# Shared by more than one crate. A dependency only one crate uses goes in that
# crate's own Cargo.toml, so parallel work on two crates never edits this table.
[workspace.dependencies]
haest-core = { version = "0.2.0", path = "crates/haest-core" }
haest-http = { version = "0.2.0", path = "crates/haest-http" }
haest-providers = { version = "0.2.0", path = "crates/haest-providers" }
haest-workspace = { version = "0.2.0", path = "crates/haest-workspace" }
haest-tools = { version = "0.2.0", path = "crates/haest-tools" }
haest-mcp = { version = "0.2.0", path = "crates/haest-mcp" }
haest-code = { version = "0.2.0", path = "crates/haest-code" }
haest-mods = { version = "0.2.0", path = "crates/haest-mods" }
haest-ts = { version = "0.2.0", path = "crates/haest-ts" }
haest-settings = { version = "0.2.0", path = "crates/haest-settings" }
haest-config = { version = "0.2.0", path = "crates/haest-config" }
haest-runtime = { version = "0.2.0", path = "crates/haest-runtime" }
haest = { version = "0.2.0", path = "crates/haest" }
haest-wire = { version = "0.2.0", path = "crates/haest-wire" }
haest-session = { version = "0.2.0", path = "crates/haest-session" }
haest-transport = { version = "0.2.0", path = "crates/haest-transport" }

# No features here: each crate names the ones it uses (haest-core: a task and
# channels, not the runtime).
tokio = { version = "1.54", default-features = false }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Every crate opts in with `[lints] workspace = true`. The gates run clippy with
# `-D warnings`, so a "warn" here fails them; a lint that is wrong for one item
# gets `#[expect(lint, reason = "...")]` on that item, never a blanket allow.
[workspace.lints.rust]
# The public surface: every item documented and debuggable, `pub` only where a
# host can reach it, and no type a host can get but cannot name.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
# Unsafe code is an exception each site claims with an `#[expect]` and a reason.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
# The 2018-edition idioms, e.g. no hidden lifetime in a path (`Value<'_>`).
rust_2018_idioms = { level = "warn", priority = -1 }
