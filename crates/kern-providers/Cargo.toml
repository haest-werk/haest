[package]
name = "kern-providers"
description = "Model API adapters for kern: Anthropic Messages, OpenAI Chat Completions + Responses, OpenRouter, any OpenAI-compatible endpoint; pluggable HTTP transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Fakes for tests in other crates: FakeTransport and SSE body builders.
testing = []

[dependencies]
kern-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "system-proxy"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
