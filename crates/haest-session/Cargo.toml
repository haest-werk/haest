[package]
name = "haest-session"
description = "A haest conversation another program can watch and drive while it runs: the session driver, its event hub (numbered frames, a replay ring, a bounded broadcast), the Backend seam transports attach to"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Approval asks answered over the session (a Prompter for haest-mods' gate).
approvals = ["dep:haest-mods"]

[dependencies]
haest-core = { workspace = true }
haest-wire = { workspace = true }
haest-mods = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
# The `[cache]` setting's policy, driven end to end in the idle tick tests.
haest-settings = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
