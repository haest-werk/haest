[package]
name = "kern-mods"
description = "kern mods: change how kern behaves without forking it. Native Rust mods and .js/.ts mod files in embedded QuickJS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kern-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
regex = "1"
# File mods: the engine (the same build the Code tool links), and TypeScript
# type stripping in pure Rust (no node, no bun at runtime).
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
oxc = { version = "0.96", features = ["transformer", "codegen", "semantic"] }

[dev-dependencies]
kern-core = { workspace = true, features = ["testing"] }
