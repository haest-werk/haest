[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

# Shared by more than one crate. A dependency only one crate uses goes in that
# crate's own Cargo.toml, so parallel work on two crates never edits this table.
[workspace.dependencies]
kern-core = { path = "crates/kern-core" }
kern-providers = { path = "crates/kern-providers" }
kern-workspace = { path = "crates/kern-workspace" }
kern-tools = { path = "crates/kern-tools" }
kern-mcp = { path = "crates/kern-mcp" }
kern-lib = { path = "crates/kern-lib" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
