[package]
name = "haest-cli"
description = "haest, the command line agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "haest"
path = "src/main.rs"

[dependencies]
haest = { workspace = true, features = ["runtime", "config"] }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
# `string`: the setting flags are built at run time from the settings registry.
clap = { version = "4.6", features = ["derive", "string"] }
serde_json = { workspace = true }
# The interactive prompt: line editing and history.
rustyline = "19"

[target.'cfg(unix)'.dependencies]
# poll(2) on stdin, so an approval ask's read can be withdrawn (ask.rs).
libc = "0.2"
