[package]
name = "haest-transport"
description = "Transports for a haest session: the same wire frames over stdio, a Unix control socket or a broker link, each a dumb pipe in front of the session's Backend, with an access check per connection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The parent process drives the conversation over the child's stdin and stdout.
stdio = ["tokio/io-std", "tokio/sync"]
# Programs on this machine reach the conversation over a Unix socket (Unix only).
unix = ["tokio/net", "dep:serde"]
# The conversation dials out to a broker over a WebSocket (TLS on ring, the
# platform's roots, as the model requests verify).
broker = ["tokio/net", "dep:tokio-tungstenite", "dep:futures", "dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
haest-core = { workspace = true }
haest-wire = { workspace = true }
haest-session = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "rt"] }
serde_json = { workspace = true }
serde = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
haest-session = { workspace = true, features = ["approvals"] }
haest-mods = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "rt", "test-util", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
