[package]
name = "haest-bridges"
description = "haest's bridges: mods and hooks written outside Rust, speaking the mod protocol. Features: js (.js/.ts mod files in embedded QuickJS, reloaded as they change), shell (a command per event), http (a POST per event); shell and http speak haest's JSON or Claude Code's hook JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# One feature per bridge, each carrying what it needs; none is on by
# default, and with none on the crate is empty and links nothing.
[features]
# TypeScript and JavaScript mod files in embedded QuickJS (`JsMod`), and a
# conversation's mod files as one mod that reloads them (`ModFiles`).
js = ["_bridge", "dep:haest-code", "dep:haest-ts", "dep:haest-settings"]
# A command per event (`ShellHook`): the event as JSON on its stdin, the
# decision on its stdout, run on the host by haest-workspace's real exec.
shell = ["_bridge", "dep:haest-workspace"]
# A POST per event (`HttpHook`) through haest-http's `HttpClient`, the host's
# own or the default.
http = ["_bridge", "dep:haest-http"]
# Internal, turned on by every bridge (not for hosts): what they all run on,
# haest-core, haest-mods' protocol and the crates its hooks are written with.
_bridge = [
    "dep:haest-core", "dep:haest-mods", "dep:async-trait", "dep:serde", "dep:serde_json",
    "dep:thiserror", "dep:tokio", "dep:tokio-util",
]

[dependencies]
# Every bridge (`_bridge` above).
haest-core = { workspace = true, optional = true }
# The events, their payloads and decisions, `Hook` and `Mod`.
haest-mods = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
# http: its types only (no client without its `reqwest` feature): the
# request goes through the host's HttpClient (no client of its own), and
# `HttpHook`'s Debug hides a URL's credentials (`redacted_url`).
haest-http = { workspace = true, optional = true }
# js: the engine, the one the Code tool runs on (haest-code's `JsEngine`), and
# its caps type, `VmCaps`.
haest-code = { workspace = true, optional = true }
# js: `.ts` mod files, through the same type stripper as the sandbox `js` command.
haest-ts = { workspace = true, optional = true }
# js: the `mod_reload` setting's word, `ModReload` (haest-settings links haest-core only).
haest-settings = { workspace = true, optional = true }
# shell: the real exec (process group, cancel, ChildEnv, output cap), given stdin.
haest-workspace = { workspace = true, optional = true }

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
haest-mods = { workspace = true, features = ["testing"] }
# The HTTP hook's tests post through the default client to `testing::Server`.
haest-http = { workspace = true, features = ["reqwest", "testing"] }
tempfile = "3"
# docs/hooks.md's test loads its config example as a file would be.
toml = "1.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
