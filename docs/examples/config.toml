# ~/.config/haest/config.toml: your own settings, read on every run.
# Every key is in ../settings.md; `haest settings` shows what a run gets and
# where each value came from. A HAEST_* variable or a flag wins over this file.

model = "openrouter:anthropic/claude-sonnet-5.5"
effort = "medium"

# What goes into the system prompt: AGENTS.md files, and your skills.
context = ["agents"]
skills = ["agents", "claude"]
skill_catalog = true

# haest starts with no tools: turn on the ones you want.
tools = ["read", "write", "edit", "bash", "grep", "glob", "web_fetch", "tasks", "skill"]
agents = true
web_search = "native"

# Projects whose own .haest/config.toml, .mcp.json and .haest/mods haest reads.
# Only your own file, HAEST_TRUSTED_DIRS or --trusted-dirs can say this.
trusted_dirs = ["~/projects"]

# What a process haest starts gets of your environment: none, core or all.
env_passthrough = "core"

# Brakes: what one turn and one conversation may spend.
max_turn_usd = 3
max_conversation_usd = 25
# At 80% of any of those caps (a subagent's own too): no new subagents, and the
# model is told once to finish with what it has. Off unless set.
wind_down_at = 0.8

# A subagent may get tighter caps than subagent_usd and subagent_minutes (the
# Agent tool's budget); its spend is held on the conversation's budget while
# it runs, so subagents running at once cannot overshoot it together.
subagent_budgets = true

# Frames kept for a peer that catches up on a running conversation's stream
# (a control socket, a broker link), besides the running turn.
event_ring = 5000

# A control socket: `haest ctl` from another terminal watches the conversation
# (command: drives it too). Your own file only.
control_socket = "watch"

# A broker this conversation links to, and what it may do (your own file
# only; the token is the key HAEST_BROKER_TOKEN, never a setting):
# broker_url = "wss://broker.example/agents"
broker_access = "watch"

# OpenRouter's provider routing, as JSON (your own file only).
provider_routing = '{"global": {"banned": ["novita"]}}'

# The prompt cache. The system prompt rarely changes and you often step away
# for longer than five minutes: keep it an hour (a dearer write, read back
# after a coffee). The conversation is written again each turn: five minutes.
[cache]
system = "1h"
tools = "1h"
history = "5m"
# While you are away, ping the cache before it expires, as long as the
# model's prices say the pings cost less than writing it again; at most for
# two hours after the last turn.
keep_warm = true
keep_warm_for = 120
# A long conversation left idle is compacted while its cache is still warm,
# when that costs less than writing the whole prompt again next turn.
compact_before_expire = { min_context = "60%", instructions = "Keep the open TODOs and the files touched." }

# Google's models on OpenRouter keep no cache entry for an hour and take no
# pre-warm: five minutes, no pings.
[cache.models."openrouter:google/*"]
system = "5m"
tools = "5m"
keep_warm = false

# Variables every process haest starts gets, the sandbox's shell included.
# ${NAME} comes from haest's environment; ${NAME:-default} when it is unset.
[env]
GH_TOKEN = "${GITHUB_TOKEN}"
NODE_ENV = "${NODE_ENV:-development}"
PAGER = "cat"

# `haest --profile review`: read-only, careful.
[profiles.review]
tools = ["read", "grep", "glob"]
effort = "high"
approvals = true

# Adds to the built-in claude profile (its keys win over the built-in ones).
[profiles.claude]
max_turn_usd = 5
