[package]
name = "kern-mcp"
description = "kern's MCP client: connects MCP servers (stdio, streamable HTTP) and offers their tools as kern tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kern-core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
base64 = "0.22"
# The official MCP SDK, client side: stdio servers as child processes, remote ones
# over streamable HTTP (reqwest; TLS through rustls with the ring provider, as WebFetch).
rmcp = { version = "3.9", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The client rmcp's HTTP transport runs on, built here (no env proxy), and its header types.
reqwest = { version = "0.13", default-features = false }
http = "1"

[dev-dependencies]
# server: the tests run a real MCP server over an in-memory duplex, never the network.
rmcp = { version = "3.9", default-features = false, features = ["client", "server"] }
tokio = { workspace = true, features = ["test-util", "io-util"] }
tokio-util = { workspace = true }
