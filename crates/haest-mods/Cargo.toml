[package]
name = "haest-mods"
description = "haest mods: change how haest behaves without forking it. Native Rust mods, hooks bound per event, and the events' protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The `testing` module: fakes for tests of mods and the decision cases a
# bridge answers the way `Hooks` does. Turn it on in `dev-dependencies` only.
testing = ["haest-core/testing"]

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
regex = "1"

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
