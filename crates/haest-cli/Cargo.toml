[package]
name = "haest-cli"
description = "haest, the command line agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "haest"
path = "src/main.rs"
# The binary and the `haest` library share a name; documenting both makes
# `cargo doc --workspace` write two haest/index.html over each other.
doc = false

[dependencies]
haest = { workspace = true, features = ["runtime", "config", "wire", "session", "transport-stdio", "transport-unix", "transport-broker"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = "1"
# `string`: the setting flags are built at run time from the settings registry.
clap = { version = "4.6", features = ["derive", "string"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The --json stream's id: a random v4 UUID per run.
uuid = { version = "1", features = ["v4"] }
# The interactive prompt: line editing and history.
rustyline = "19"
# poll(2) on stdin, so an approval ask's read can be withdrawn (ask.rs).
# haest-cli is Unix only (a compile_error! elsewhere, src/main.rs).
libc = "0.2"

[dev-dependencies]
# tests/broker.rs: a broker the run links to (tungstenite's blocking server).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
