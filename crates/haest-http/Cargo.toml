[package]
name = "haest-http"
description = "haest's HTTP seam: a small request/response client trait haest's model calls and tools send through, and its default over reqwest and rustls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["reqwest"]
# The default client, `ReqwestClient`: reqwest over rustls (ring), and
# `build_reqwest`. Off, this crate is the trait and its types only, and the
# default client (`HttpClientRef::default()`) refuses every request until a
# host hands in its own: a host with its own HTTP stack builds no reqwest.
reqwest = ["dep:reqwest", "dep:rustls"]
# Conversions to and from the `http` crate's types, for a host whose own
# stack speaks them (an axum router, a hyper client): `Request` into an
# `http::Request<Bytes>`, an `http::Response<B>` into a `Response`. reqwest
# builds on the same `http` and `http-body`, so with it this adds no crate.
http = ["dep:http", "dep:http-body"]
# The `testing` module: `testing::Server`, an HTTP server on 127.0.0.1 for a
# test, on threads of its own (std only). Turn it on in `dev-dependencies`
# only: like every `testing` feature in haest, it is outside semver.
testing = []

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
# TLS on ring: one crypto stack in the binary and no C toolchain (aws-lc-sys
# needs cmake) to build it. No `system-proxy`: the default client reads no
# proxy settings (D15). `stream`: a model's answer is read as it arrives.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# This crate's own `testing`, for its tests: every test in tests/ sends to
# `testing::Server`. Path only, so `cargo package` drops it: each of those
# files also needs `feature = "testing"`, and outside the workspace they build
# empty unless `--features testing` is passed.
haest-http = { path = ".", default-features = false, features = ["testing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
