[package]
name = "haest-workspace"
description = "Workspaces for haest: the real disk + bash, and a bashkit sandbox over a copy-on-write overlay (or over any haest Fs)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
haest-core = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "io-util"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
# Pinned: pre-1.0, and it sits behind haest's own Fs (PLAN.md D4, R1).
bashkit = { version = "=0.20.3", default-features = false, features = ["realfs", "jq"] }
similar = "3"
libc = "0.2"
# xan (sandbox/xan): RFC 4180 CSV, and its =~ / match().
csv = "1"
regex = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
