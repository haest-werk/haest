[package]
name = "haest-issues"
description = "Experimental, and an example of how to write tools for haest: issue-tracker tools over one trait, with a GitHub Issues backend and a markdown board-card backend"
# Its own version: experimental, 0.1.0 beside haest 0.2.0, 0.2.0 beside 0.3.0,
# 0.3.0 beside 0.4.0, 0.4.0 beside 0.5.0.
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["reqwest"]
# The GitHub tracker's default client: haest-http's shared `ReqwestClient`.
# Off, no reqwest, rustls or ring is built, and a tracker not handed a client
# of the host's (`with_http`) fails every call, saying so.
reqwest = ["haest-http/reqwest"]

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# GitHub's requests: the workspace's one HTTP seam; re-exported as `haest_issues::http`.
haest-http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# The process-wide TLS provider: a new tracker must not have set one up.
rustls = { version = "0.23", default-features = false }
# The example drives a whole agent turn with the scripted provider.
haest-core = { workspace = true, features = ["testing"] }
# The card backend is tested, and the example runs, over the real disk.
haest-workspace = { workspace = true }
tempfile = "3"

# The example runs under `cargo test` too, so a change that breaks how a host
# registers these tools fails the suite.
[[example]]
name = "issues"
path = "examples/issues.rs"
test = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
