[package]
name = "haest-tools"
description = "haest's built-in tools: Read, Write, Edit, Glob, Grep, Bash, WebFetch, tasks, ToolSearch, Skill"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
haest-core = { workspace = true }
# WebFetch's and GenerateImage's requests; re-exported as `haest_tools::http`.
haest-http = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { workspace = true }
# Glob: the pattern matcher only; the directory walk goes through the workspace Fs.
globset = { version = "0.4", default-features = false }
# WebFetch: WHATWG URL parsing (odd IPv4 spellings normalise the way a browser's do)
# and HTML -> Markdown.
url = "2"
htmd = "0.5"
# GenerateImage: the Image API's base64 answer, the model list's setting specs.
base64 = "0.22"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# process: the Grep test runs the real rg (when installed) to prove it takes our argv.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
# testing: the scripted provider, for tests that run a whole agent turn.
haest-core = { workspace = true, features = ["testing"] }
# Background jobs are tested over the real workspace: real processes, a real process group.
haest-workspace = { workspace = true }
tempfile = "3"
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
