[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/haest-werk/haest"
readme = "README.md"
keywords = ["agent", "llm", "ai", "tools", "mcp"]
categories = ["development-tools"]

# Shared by more than one crate. A dependency only one crate uses goes in that
# crate's own Cargo.toml, so parallel work on two crates never edits this table.
[workspace.dependencies]
haest-core = { version = "0.4.0", path = "crates/haest-core" }
# No default features: reqwest (the default client) is each crate's to ask for
# (`features = ["reqwest"]`), so a crate that only names the types builds none.
haest-http = { version = "0.4.0", path = "crates/haest-http", default-features = false }
haest-providers = { version = "0.4.0", path = "crates/haest-providers", default-features = false }
haest-workspace = { version = "0.4.0", path = "crates/haest-workspace" }
haest-tools = { version = "0.4.0", path = "crates/haest-tools" }
haest-mcp = { version = "0.4.0", path = "crates/haest-mcp" }
haest-code = { version = "0.4.0", path = "crates/haest-code" }
haest-mods = { version = "0.4.0", path = "crates/haest-mods" }
haest-ts = { version = "0.4.0", path = "crates/haest-ts" }
haest-settings = { version = "0.4.0", path = "crates/haest-settings" }
# No default features: the facade's `mcp` turns on the loader's `mcp`.
haest-config = { version = "0.4.0", path = "crates/haest-config", default-features = false }
haest-runtime = { version = "0.4.0", path = "crates/haest-runtime" }
haest = { version = "0.4.0", path = "crates/haest" }
haest-wire = { version = "0.4.0", path = "crates/haest-wire" }
haest-session = { version = "0.4.0", path = "crates/haest-session" }
haest-transport = { version = "0.4.0", path = "crates/haest-transport" }
haest-prompt = { version = "0.4.0", path = "crates/haest-prompt" }

# No features here: each crate names the ones it uses (haest-core: a task and
# channels, not the runtime).
tokio = { version = "1.54", default-features = false }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Every crate opts in with `[lints] workspace = true`. The gates run clippy with
# `-D warnings`, so a "warn" here fails them; a lint that is wrong for one item
# gets `#[expect(lint, reason = "...")]` on that item, never a blanket allow.
[workspace.lints.rust]
# The public surface: every item documented and debuggable, `pub` only where a
# host can reach it, and no type a host can get but cannot name.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
# Unsafe code is an exception each site claims with an `#[expect]` and a reason.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
# The 2018-edition idioms, e.g. no hidden lifetime in a path (`Value<'_>`).
rust_2018_idioms = { level = "warn", priority = -1 }

# clippy's default groups stay on; these are picked from restriction and
# pedantic for what they catch in a library. Settings: clippy.toml.
[workspace.lints.clippy]
# A suppression is an `#[expect]` with a reason, so it expires when unneeded.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# One unsafe operation per block, each under a SAFETY comment, pointers made with `&raw`.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
borrow_as_ptr = "warn"
# A library never prints (a host may speak a protocol on stdout) nor exits.
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
# No debugging leftovers or placeholders in a published crate.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A replaced error stays the new one's source, or its binding says why not.
map_err_ignore = "warn"
# A public function's docs say how it fails and when it panics.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# API shape: no flag soup, no hasher lock-in, no `Option<Option<_>>`, no
# needless `async`, `for x in &c` where `c.iter()` exists, `#[must_use]` setters.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
implicit_hasher = "warn"
option_option = "warn"
unused_async = "warn"
iter_without_into_iter = "warn"
into_iter_without_iter = "warn"
return_self_not_must_use = "warn"
# A hand-written Debug that leaves fields out says so (`finish_non_exhaustive`).
missing_fields_in_debug = "warn"
# Small correctness: lossless casts through `From`, a midpoint that cannot
# overflow, file extensions compared without case, a bool matched by `if`.
cast_lossless = "warn"
manual_midpoint = "warn"
case_sensitive_file_extension_comparisons = "warn"
match_bool = "warn"
