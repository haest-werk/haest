[package]
name = "kern-cli"
description = "kern, the command line agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kern"
path = "src/main.rs"

[dependencies]
kern-lib = { workspace = true, features = ["runtime"] }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
# `string`: the setting flags are built at run time from the settings registry.
clap = { version = "4.6", features = ["derive", "string"] }
serde_json = { workspace = true }
# The interactive prompt: line editing and history.
rustyline = "19"

[target.'cfg(unix)'.dependencies]
# poll(2) on stdin, so an approval ask's read can be withdrawn (ask.rs).
libc = "0.2"
