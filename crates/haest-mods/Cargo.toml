[package]
name = "haest-mods"
description = "haest mods: change how haest behaves without forking it. Native Rust mods and .js/.ts mod files in embedded QuickJS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
regex = "1"
# File mods: the engine (the same build the Code tool links), and TypeScript
# type stripping in pure Rust (no node, no bun at runtime).
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
# `.ts` mod files: the same type stripper as the sandbox `js` command.
haest-ts = { workspace = true }

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
