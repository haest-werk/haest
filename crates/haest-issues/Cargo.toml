[package]
name = "haest-issues"
description = "Experimental, and an example of how to write tools for haest: issue-tracker tools over one trait, with a GitHub Issues backend and a markdown board-card backend"
# Its own version: first published (experimental) as 0.1.0, beside haest 0.2.0.
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# GitHub's requests: the workspace's one HTTP seam; re-exported as `haest_issues::http`.
haest-http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The process-wide TLS provider: a new tracker must not have set one up.
rustls = { version = "0.23", default-features = false }
# The example drives a whole agent turn with the scripted provider.
haest-core = { workspace = true, features = ["testing"] }
# The card backend is tested, and the example runs, over the real disk.
haest-workspace = { workspace = true }
tempfile = "3"

# The example runs under `cargo test` too, so a change that breaks how a host
# registers these tools fails the suite.
[[example]]
name = "issues"
path = "examples/issues.rs"
test = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
