[package]
name = "haest-providers"
description = "Model API adapters for haest: Anthropic Messages, OpenAI Chat Completions + Responses, OpenRouter, any OpenAI-compatible endpoint; pluggable HTTP client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["reqwest"]
# The default client: every provider sends over haest-http's shared
# `ReqwestClient` unless handed one. Off, no reqwest, rustls or ring is built,
# and a registry or provider without a client of the host's refuses to send.
reqwest = ["haest-http/reqwest"]
# Fakes for tests in other crates: FakeHttp and SSE body builders.
testing = []

[dependencies]
haest-core = { workspace = true }
# How every request travels; re-exported as `haest_providers::http`.
haest-http = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
