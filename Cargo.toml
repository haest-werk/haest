[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

# Shared by more than one crate. A dependency only one crate uses goes in that
# crate's own Cargo.toml, so parallel work on two crates never edits this table.
[workspace.dependencies]
haest-core = { path = "crates/haest-core" }
haest-providers = { path = "crates/haest-providers" }
haest-workspace = { path = "crates/haest-workspace" }
haest-tools = { path = "crates/haest-tools" }
haest-mcp = { path = "crates/haest-mcp" }
haest-code = { path = "crates/haest-code" }
haest-mods = { path = "crates/haest-mods" }
haest-ts = { path = "crates/haest-ts" }
haest-settings = { path = "crates/haest-settings" }
haest-config = { path = "crates/haest-config" }
haest-runtime = { path = "crates/haest-runtime" }
haest = { path = "crates/haest" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
