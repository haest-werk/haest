[package]
name = "haest-issues"
description = "Experimental, and an example of how to write tools for haest: issue-tracker tools over one trait, with a GitHub Issues backend and a markdown board-card backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# GitHub: the same HTTP client haest-tools' WebFetch and GenerateImage use
# (reqwest on rustls with ring, no proxy), behind this crate's own `Http` seam.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The example drives a whole agent turn with the scripted provider.
haest-core = { workspace = true, features = ["testing"] }
# The card backend is tested, and the example runs, over the real disk.
haest-workspace = { workspace = true }
tempfile = "3"

# The example runs under `cargo test` too, so a change that breaks how a host
# registers these tools fails the suite.
[[example]]
name = "issues"
path = "examples/issues.rs"
test = true
