[package]
name = "haest-core"
description = "haest's agent loop and the contracts every plug-in implements: Provider, Tool, Fs, Workspace, AgentHooks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Fakes for tests in other crates: ScriptedProvider, text_answer, tool_answer.
testing = []

[dependencies]
# The session file's writer task and its channels; no runtime of its own.
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
# float_roundtrip: a session's numbers replay to the exact f64 the TypeScript haest
# wrote (the default parser can land one bit off).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
base64 = "0.22"
# SKILL.md frontmatter (block scalars, lists); pure Rust.
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
