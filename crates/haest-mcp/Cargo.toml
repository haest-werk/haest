[package]
name = "haest-mcp"
description = "haest's MCP client: connects MCP servers (stdio, streamable HTTP) and offers their tools as haest tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# rmcp in haest-mcp's API: `haest_mcp::rmcp` and `McpHub::connect_transport`
# (a server over a transport the host opened). Off by default, so an rmcp
# release that breaks its API breaks only hosts that turn this on.
rmcp = []

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
base64 = "0.22"
# The official MCP SDK, client side: stdio servers as child processes, remote ones
# over streamable HTTP. rmcp's HTTP transport runs only on a reqwest client, so it
# is handed one configured and built by haest-http (no env proxy, TLS set up once).
rmcp = { version = "3.9", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }
haest-http = { workspace = true, features = ["reqwest"] }

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
# server: the tests run a real MCP server over an in-memory duplex, never the network.
rmcp = { version = "3.9", default-features = false, features = ["client", "server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "io-util"] }
tokio-util = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
