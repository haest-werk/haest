[package]
name = "haest-runtime"
description = "haest assembled from its settings: providers, workspace, tools, MCP, mods, subagents and the session file, for any host with a UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
haest-core = { workspace = true }
haest-providers = { workspace = true }
haest-workspace = { workspace = true }
haest-tools = { workspace = true }
haest-mcp = { workspace = true }
haest-code = { workspace = true }
haest-mods = { workspace = true }
haest-settings = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# Listing sessions: stats and heads read a few at a time.
futures = { workspace = true }
# Session ids: random v4 UUIDs.
uuid = { version = "1", features = ["v4"] }
haest-session = { workspace = true, optional = true, features = ["approvals"] }
haest-wire = { workspace = true, optional = true }

[features]
# The conversation behind a haest-session session: `Runtime` as its `Driven`,
# and a `Ui` that tells the session's stream. Off by default.
session = ["dep:haest-session", "dep:haest-wire"]

[dev-dependencies]
haest-core = { workspace = true, features = ["testing"] }
# rmcp: the session tests connect that server with McpHub::connect_transport.
haest-mcp = { workspace = true, features = ["rmcp"] }
# server: the session tests close a real MCP server over an in-memory duplex.
rmcp = { version = "3.9", default-features = false, features = ["client", "server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
