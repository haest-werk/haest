[package]
name = "kern-config"
description = "kern's settings loader: a builder over TOML files, KERN_* variables and flags, laid in the order a host adds them, into the values the runtime is handed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kern-core = { workspace = true }
kern-settings = { workspace = true }
# providers.json and the OpenRouter routing variable, read here and handed in.
kern-providers = { workspace = true }
# A trusted project's .mcp.json, read here and handed in.
kern-mcp = { workspace = true }
# The config files: ~/.config/kern/config.toml and a trusted project's .kern/config.toml.
toml = "1.1"

[dev-dependencies]
tokio = { workspace = true }
