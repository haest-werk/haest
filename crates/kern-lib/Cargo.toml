[package]
name = "kern-lib"
description = "kern: an agent loop and tool harness you embed. One dependency, features pick the parts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kern"

[features]
default = ["providers", "workspace", "tools", "mcp", "code", "mods"]
providers = ["dep:kern-providers"]
workspace = ["dep:kern-workspace"]
tools = ["dep:kern-tools"]
mcp = ["dep:kern-mcp"]
# The QuickJS engine: the Code tool and the sandbox `js` command.
code = ["dep:kern-code"]
# Mods: JS/TS files that hook tools, prompts and commands; approvals and plan mode.
mods = ["dep:kern-mods"]

[dependencies]
kern-core = { workspace = true }
kern-providers = { workspace = true, optional = true }
kern-workspace = { workspace = true, optional = true }
kern-tools = { workspace = true, optional = true }
kern-mcp = { workspace = true, optional = true }
kern-code = { workspace = true, optional = true }
kern-mods = { workspace = true, optional = true }

# The brain example (examples/brain): what a host implementing the plug points needs.
[dev-dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
