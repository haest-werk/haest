[package]
name = "haest-tools"
description = "haest's built-in tools: Read, Write, Edit, Glob, Grep, Bash, WebFetch, tasks, ToolSearch, Skill"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
haest-core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
# Glob: the pattern matcher only; the directory walk goes through the workspace Fs.
globset = { version = "0.4", default-features = false }
# WebFetch: WHATWG URL parsing (odd IPv4 spellings normalise the way a browser's do),
# a GET client that never follows redirects on its own, and HTML -> Markdown.
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
htmd = "0.5"
# GenerateImage: the Image API's base64 answer, the model list's setting specs.
base64 = "0.22"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# process: the Grep test runs the real rg (when installed) to prove it takes our argv.
tokio = { workspace = true, features = ["process"] }
# testing: the scripted provider, for tests that run a whole agent turn.
haest-core = { workspace = true, features = ["testing"] }
# Background jobs are tested over the real workspace: real processes, a real process group.
haest-workspace = { workspace = true }
tempfile = "3"
libc = "0.2"
