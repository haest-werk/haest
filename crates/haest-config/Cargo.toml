[package]
name = "haest-config"
description = "haest's settings loader: a builder over TOML files, HAEST_* variables and flags, laid in the order a host adds them, into the values the runtime is handed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["mcp"]
# A trusted project's .mcp.json, read into `Loaded::mcp_servers`. Off, the
# loader builds no MCP client (rmcp, reqwest, rustls, ring): `mcp = true` is
# then a note, and nothing is read.
mcp = ["dep:haest-mcp"]

[dependencies]
haest-core = { workspace = true }
haest-settings = { workspace = true }
# providers.json and the OpenRouter routing variable, read here and handed in.
# Its types only: the loader sends nothing, so no client.
haest-providers = { workspace = true }
# A trusted project's .mcp.json, read here and handed in.
haest-mcp = { workspace = true, optional = true }
# The `hooks` setting's type, read and checked here. No bridge (no `shell`,
# no `http`): the runtime binds the entries.
haest-bridges = { workspace = true }
# The config files: ~/.config/haest/config.toml and a trusted project's .haest/config.toml.
toml = "1.1"
# A table setting's value read into its typed field, and written back.
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# The image tool's own models, for docs/settings.md's "Default" of an unset key.
haest-tools = { workspace = true }
# The real disk, for the crate docs' example of loading real files.
haest-workspace = { workspace = true }
# The events a `hooks` entry is bound to, in the tests.
haest-mods = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
