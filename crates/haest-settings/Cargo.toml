[package]
name = "haest-settings"
description = "haest's settings as plain values: what a conversation is built from. No files, no environment, no flags"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# haest-core only: a host that writes its settings out pulls in no tools, no HTTP.
haest-core = { workspace = true }
# The `[cache]` table's own shape, as a config file writes it (haest-core
# already depends on serde, so nothing new is built).
serde = { workspace = true }

[dev-dependencies]
# The `[cache]` table read as a config file holds it.
toml = "1.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
