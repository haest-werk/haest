[package]
name = "haest"
description = "haest: an agent loop and tool harness you embed. One dependency, features pick the parts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "haest"

[features]
default = ["providers", "workspace", "tools", "mcp", "code", "mods", "settings", "reqwest"]
# The HTTP seam: on with every part that sends requests through it.
http = ["dep:haest-http"]
# The default client over reqwest and rustls (`http::ReqwestClient`). Off, with
# `providers` only, no reqwest is built and the model calls go through the
# client the host hands in (the default refuses to send). `tools` and `mcp`
# turn it on whatever this says: WebFetch and rmcp run on reqwest.
reqwest = ["haest-http?/reqwest", "haest-providers?/reqwest"]
providers = ["dep:haest-providers", "http"]
workspace = ["dep:haest-workspace"]
tools = ["dep:haest-tools", "http"]
# With `config` too: the loader reads a trusted project's .mcp.json.
mcp = ["dep:haest-mcp", "haest-config?/mcp"]
# rmcp in `haest::mcp`'s API: `haest::mcp::rmcp` and `McpHub::connect_transport`
# (a server over a transport the host opened). Off, so an rmcp release that
# breaks its API breaks only hosts that turn this on.
rmcp = ["mcp", "haest-mcp/rmcp"]
# The QuickJS engine: the Code tool and the sandbox `js` command.
code = ["dep:haest-code"]
# Mods: JS/TS files that hook tools, prompts and commands; approvals and plan mode.
# With `session` too: approval asks answered over the session.
mods = ["dep:haest-mods", "haest-session?/approvals"]
# Settings as plain values a host writes out: no files, no environment, no flags.
settings = ["dep:haest-settings"]
# The loader: settings from TOML files, HAEST_* variables and flags, plus what
# the runtime is handed beside them (keys, providers.json, child env; with `mcp`
# too, a trusted project's .mcp.json).
config = ["dep:haest-config", "settings", "providers"]
# The whole conversation built from what a host hands in, behind its UI (the CLI's base).
runtime = ["dep:haest-runtime", "settings", "providers", "workspace", "tools", "mcp", "code", "mods"]
# The wire format: the envelope around a conversation's events, requests, the
# replay ring, the NDJSON line codec. serde only.
wire = ["dep:haest-wire"]
# A conversation another program watches and drives while it runs: the session
# driver, its handle and stream. With `runtime`, the runtime is one; with
# `mods`, approval asks go over it.
session = ["dep:haest-session", "wire", "haest-runtime?/session"]
# The session served to other programs: one connection's rules (`serve`), over
# any line source and sink. Each transport below is its own feature, and does
# nothing until a host attaches it.
transport = ["dep:haest-transport", "session"]
# A parent process drives the conversation over this one's stdin and stdout.
transport-stdio = ["transport", "haest-transport/stdio"]
# Programs on this machine watch (or drive) the conversation over a Unix socket.
transport-unix = ["transport", "haest-transport/unix"]
# The conversation dials out to a broker over a WebSocket (pulls a WebSocket client on rustls).
transport-broker = ["transport", "haest-transport/broker"]
# Fakes for a host's tests: a scripted model that records every request, and
# (with the providers) a fake HTTP client and the providers' SSE bodies.
testing = ["haest-core/testing", "haest-providers?/testing"]

[dependencies]
haest-core = { workspace = true }
# Named by the traits a host implements: re-exported, so the host's versions match.
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }
haest-http = { workspace = true, optional = true }
haest-providers = { workspace = true, optional = true }
haest-workspace = { workspace = true, optional = true }
haest-tools = { workspace = true, optional = true }
haest-mcp = { workspace = true, optional = true }
haest-code = { workspace = true, optional = true }
haest-mods = { workspace = true, optional = true }
haest-settings = { workspace = true, optional = true }
haest-config = { workspace = true, optional = true }
haest-runtime = { workspace = true, optional = true }
haest-wire = { workspace = true, optional = true }
haest-session = { workspace = true, optional = true }
haest-transport = { workspace = true, optional = true }

# The notebook example runs under `cargo test` too, so a change that breaks a
# plug point it uses fails the suite, not only a `cargo run` nobody did.
[[example]]
name = "notebook"
path = "examples/notebook/main.rs"
test = true

# A durable run on the memory store: the finished-run shortcut, a kill and a resume.
[[example]]
name = "durable_run"
path = "examples/durable_run.rs"
test = true

# Both ends of the wire format: frames numbered, kept, read back, caught up.
[[example]]
name = "wire"
required-features = ["wire"]
test = true

# A session over an agent: a watcher, input mid-turn, a late peer catching up.
[[example]]
name = "session"
required-features = ["session"]
test = true

# A parent process driving a conversation over a pipe pair: turns, replies, a stop.
[[example]]
name = "stdio"
required-features = ["transport-stdio"]
test = true

# A conversation on a control socket: found, followed and driven from another task.
[[example]]
name = "control_socket"
required-features = ["transport-unix"]
test = true

# A conversation linked to a broker: hello with the token, the broker's ack, the stream.
[[example]]
name = "broker"
required-features = ["transport-broker"]
test = true

# Wind-down (`wind_down_at`) with a host's subagents, against a scripted model.
[[example]]
name = "wind_down"
path = "examples/wind_down.rs"
test = true

# A host's own thresholds (remind the model, warn the human), against a scripted model.
[[example]]
name = "threshold"
path = "examples/threshold.rs"
test = true

# The notebook example and tests/plug_in.rs: what a host implementing the plug
# points needs besides haest (async_trait, serde_json and CancellationToken come
# from haest's own re-exports).
[dev-dependencies]
# The front page's runnable examples drive whole turns with the scripted model.
haest-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = { workspace = true }
serde = { workspace = true }
# The broker example's broker end.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
